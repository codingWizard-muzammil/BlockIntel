services:
  ethereum:
    build: ./ethereum
    container_name: blockintel-chain-ethereum
    ports:
      - "8545:8545"
    restart: unless-stopped

  bnb:
    build: ./bnb
    container_name: blockintel-chain-bnb
    ports:
      - "8546:8545"
    restart: unless-stopped

  avalanche:
    build: ./avalanche
    container_name: blockintel-chain-avalanche
    ports:
      - "8547:8545"
    restart: unless-stopped

  polygon:
    build: ./polygon
    container_name: blockintel-chain-polygon
    ports:
      - "8548:8545"
    restart: unless-stopped

  arbitrum:
    build: ./arbitrum
    container_name: blockintel-chain-arbitrum
    ports:
      - "8549:8545"
    restart: unless-stopped

  optimism:
    build: ./optimism
    container_name: blockintel-chain-optimism
    ports:
      - "8550:8545"
    restart: unless-stopped

# Solana isn't here: solana-test-validator hits two Docker-specific
# problems that don't exist running natively — it panics on a wildcard
# --bind-address (needed to satisfy Docker's port-mapping), and newer
# releases hard-require io_uring, which Docker's default seccomp profile
# blocks. Run it with ./solana/start.sh (and ./solana/stop.sh) instead —
# see chains/solana/README.md.

# To add another chain: create ./<chain>/Dockerfile, then add a service
# block here pointing `build:` at that folder. `docker compose up --build`
# starts every chain in this file.
